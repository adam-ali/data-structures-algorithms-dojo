<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Dojo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥋</text></svg>"><script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6b6b70; --border: #e4e4e0;
    --accent: #3b5bdb; --accent-soft: #e7ecff; --ok: #2b8a3e; --ok-soft: #e3f5e6; --bad: #c92a2a; --bad-soft: #fde8e8;
    --code: #f1f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --border: #2e2e33;
      --accent: #8ea2ff; --accent-soft: #252b45; --ok: #69db7c; --ok-soft: #1e3324; --bad: #ff8787; --bad-soft: #3a2020;
      --code: #26262a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--border); background: var(--panel); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav .brand { font-weight: 700; font-size: 18px; padding: 0 8px 14px; display: block; }
  nav .home { display: block; padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; }
  nav details { margin-bottom: 2px; }
  nav summary { cursor: pointer; padding: 6px 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; list-style: none; }
  nav summary::-webkit-details-marker { display: none; }
  nav summary:hover, nav .home:hover, nav .prob:hover { background: var(--code); }
  nav .lvl { font-size: 12px; color: var(--muted); padding: 6px 8px 2px 18px; text-transform: uppercase; letter-spacing: .04em; }
  nav .prob { display: block; padding: 4px 8px 4px 26px; border-radius: 6px; font-size: 14px; }
  nav .empty { padding: 2px 8px 2px 26px; font-size: 13px; color: var(--muted); font-style: italic; }
  nav .active { background: var(--accent-soft) !important; color: var(--accent); }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  main { padding: 32px 40px; max-width: 980px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .n { font-size: 26px; font-weight: 700; }
  .card .l { color: var(--muted); font-size: 13px; }
  h2 { font-size: 17px; margin: 28px 0 12px; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .topic { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .topic .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .topic .desc { color: var(--muted); font-size: 13px; margin: 4px 0 10px; min-height: 2.6em; }
  .pips { display: flex; gap: 4px; margin-bottom: 8px; }
  .pip { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .pip.done { background: var(--ok); }
  .pip.cur { background: var(--accent); }
  .topic .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; width: max-content; max-width: 100%; overflow-x: auto; }
  .heat div { width: 12px; height: 12px; border-radius: 2px; background: var(--border); }
  .heat .h1 { background: color-mix(in srgb, var(--ok) 40%, var(--border)); }
  .heat .h2 { background: color-mix(in srgb, var(--ok) 70%, var(--border)); }
  .heat .h3 { background: var(--ok); }
  .md { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 32px 24px; }
  .md h1 { font-size: 24px; margin-top: 20px; }
  .md h2 { font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .md code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13.5px; }
  .md pre { background: var(--code); padding: 14px 16px; border-radius: 8px; overflow-x: auto; }
  .md pre code { padding: 0; background: none; }
  .md details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .md summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .cmd { font-family: ui-monospace, monospace; font-size: 13px; background: var(--code); padding: 10px 14px; border-radius: 8px; margin: 14px 0 20px; overflow-x: auto; white-space: nowrap; }
  .muted { color: var(--muted); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 20px 16px; }
    .md { padding: 4px 16px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const DAY = 86400000;
const ago = (iso) => {
  if (!iso) return "never";
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / DAY);
  return d === 0 ? "today" : d === 1 ? "yesterday" : `${d}d ago`;
};
let DATA;

async function load() {
  DATA = await (await fetch("/api/data")).json();
  render();
}

function problemStatus(p) {
  if (p.attempts.some((a) => a.solved && a.hints === 0)) return '<span class="badge ok">clean</span>';
  if (p.attempts.some((a) => a.solved)) return '<span class="badge ok">solved</span>';
  if (p.attempts.length) return '<span class="badge bad">tried</span>';
  return "";
}

function renderNav(route) {
  const nav = document.getElementById("nav");
  const open = new Set([...nav.querySelectorAll("details[open]")].map((d) => d.dataset.id));
  nav.innerHTML = `<a class="brand" href="#/">🥋 DSA Dojo</a>
    <a class="home ${route.view === "home" ? "active" : ""}" href="#/">📊 Progress</a>` +
    DATA.topics.map((t) => {
      const isOpen = open.has(t.id) || route.topic === t.id;
      return `<details data-id="${t.id}" ${isOpen ? "open" : ""}>
        <summary><span>${esc(t.name)}</span><span class="badge">L${t.state.level}</span></summary>
        ${t.levels.map((l) => `<div class="lvl">Level ${l.level}</div>` + (l.problems.length
          ? l.problems.map((p) => `<a class="prob ${route.topic === t.id && route.slug === p.slug ? "active" : ""}" href="#/p/${t.id}/${p.slug}">${esc(p.meta.title ?? p.slug)} ${problemStatus(p)}</a>`).join("")
          : `<div class="empty">no problems yet</div>`)).join("")}
      </details>`;
    }).join("");
}

function heatmap(log) {
  const counts = {};
  for (const a of log) counts[a.date.slice(0, 10)] = (counts[a.date.slice(0, 10)] ?? 0) + 1;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today.getTime() - (7 * 16 - 1) * DAY);
  start.setDate(start.getDate() - start.getDay()); // align columns to weeks starting Sunday
  let cells = "";
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const key = d.toLocaleDateString("en-CA");
    const n = counts[key] ?? 0;
    cells += `<div class="${n ? "h" + Math.min(n, 3) : ""}" title="${key}: ${n} attempt${n === 1 ? "" : "s"}"></div>`;
  }
  return `<div class="heat">${cells}</div>`;
}

function streak(log) {
  const days = new Set(log.map((a) => new Date(a.date).toLocaleDateString("en-CA")));
  let n = 0;
  const d = new Date();
  if (!days.has(d.toLocaleDateString("en-CA"))) d.setDate(d.getDate() - 1); // today not done yet doesn't break it
  while (days.has(d.toLocaleDateString("en-CA"))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function attemptsTable(rows) {
  if (!rows.length) return '<p class="muted">No attempts yet. Log one with <code>npm run log</code>.</p>';
  return `<table><thead><tr><th>Date</th><th>Problem</th><th>Lvl</th><th>Tests</th><th>Time</th><th>Hints</th><th>Notes</th></tr></thead><tbody>` +
    rows.map((a) => `<tr>
      <td>${esc(a.date.slice(0, 10))}</td>
      <td>${a.solved ? "✅" : "❌"} ${esc(a.problem)}</td>
      <td>${a.level}</td>
      <td>${a.passed}/${a.total}</td>
      <td>${a.minutes != null ? a.minutes + "m" : "–"}</td>
      <td>${a.hints}</td>
      <td class="muted">${esc(a.notes ?? "")}</td></tr>`).join("") + "</tbody></table>";
}

function renderHome() {
  const log = DATA.log;
  const solved = log.filter((a) => a.solved);
  const clean = solved.filter((a) => a.hints === 0);
  const timed = solved.filter((a) => a.minutes != null);
  const avg = timed.length ? Math.round(timed.reduce((s, a) => s + a.minutes, 0) / timed.length) : null;
  const card = (n, l) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return `<h1>Progress</h1><div class="sub">${log.length ? `Last practised ${ago(log.at(-1).date)}` : "No attempts logged yet"}</div>
    <div class="cards">
      ${card(log.length, "attempts")}${card(solved.length, "solved")}${card(clean.length, "hint-free solves")}
      ${card(streak(log) + "🔥", "day streak")}${card(avg != null ? avg + "m" : "–", "avg solve time")}
    </div>
    <h2>Activity</h2>${heatmap(log)}
    <h2>Topics</h2><div class="topics">` +
    DATA.topics.map((t) => {
      const s = t.state;
      return `<div class="topic">
        <div class="name"><span>${esc(t.name)}</span><span class="badge">Level ${s.level}</span></div>
        <div class="desc">${esc(t.levels[s.level - 1].description)}</div>
        <div class="pips">${[1, 2, 3, 4].map((l) => `<div class="pip ${l < s.level ? "done" : l === s.level ? "cur" : ""}"></div>`).join("")}</div>
        <div class="meta"><span>${s.cleanAtLevel}/${DATA.cleanToLevelUp} clean to level up</span><span>${s.solved}/${s.attempts} solved</span></div>
        <div class="meta"><span>${s.avgMinutes != null ? "avg " + s.avgMinutes + "m" : ""}</span><span>${ago(s.lastPractised)}</span></div>
      </div>`;
    }).join("") + `</div>
    <h2>Recent attempts</h2>${attemptsTable(log.slice(-20).reverse())}`;
}

function renderProblem(topicId, slug) {
  const t = DATA.topics.find((x) => x.id === topicId);
  const p = t?.levels.flatMap((l) => l.problems).find((x) => x.slug === slug);
  if (!p) return `<h1>Not found</h1><p class="muted">${esc(topicId)}/${esc(slug)}</p>`;
  const num = slug.split("-")[0];
  return `<div class="sub">${esc(p.path)} · created ${esc(p.meta.created ?? "?")} ${problemStatus(p)}</div>
    <div class="md">${marked.parse(p.markdown)}</div>
    <div class="cmd">npm run log -- ${esc(topicId)}/${esc(num)} --mins &lt;m&gt; --hints &lt;h&gt;</div>
    <h2>Your attempts</h2>${attemptsTable([...p.attempts].reverse())}`;
}

function route() {
  const [, view, topic, slug] = location.hash.slice(1).split("/");
  return view === "p" ? { view: "problem", topic, slug } : { view: "home" };
}

function render() {
  const r = route();
  renderNav(r);
  document.getElementById("main").innerHTML = r.view === "problem" ? renderProblem(r.topic, r.slug) : renderHome();
  window.scrollTo(0, 0);
}

addEventListener("hashchange", render);
addEventListener("focus", load); // pick up new problems/attempts when you come back to the tab
load().catch((e) => (document.getElementById("main").innerHTML = `<p>Couldn't load data: ${esc(e)}</p>`));
</script>
</body>
</html>
